<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | User Record Management System</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main class="page-shell page-shell-dashboard">
        <section class="dashboard-layout">
            <header class="card dashboard-header">
                <div>
                    <span class="eyebrow">Dashboard</span>
                    <h1>User profile</h1>
                    <p class="subtext">View and manage your account details.</p>
                </div>
                <button id="logout-button" type="button" class="button button-secondary">Logout</button>
            </header>

            <section class="card">
                <div class="section-heading">
                    <h2>Profile details</h2>
                    <p class="subtext">This data is loaded from your authenticated account.</p>
                </div>

                <div id="dashboard-message" class="status-message" aria-live="polite"></div>

                <form id="profile-form" class="form-stack">
                    <div class="field-grid">
                        <label class="field">
                            <span>Name</span>
                            <input type="text" name="name" required>
                        </label>

                        <label class="field">
                            <span>Email</span>
                            <input type="email" name="email" readonly>
                        </label>
                    </div>

                    <div class="field-grid">
                        <label class="field">
                            <span>Phone</span>
                            <input type="text" name="phone">
                        </label>

                        <label class="field">
                            <span>Department</span>
                            <input type="text" name="department">
                        </label>
                    </div>

                    <label class="field">
                        <span>Address</span>
                        <textarea name="address" rows="4"></textarea>
                    </label>

                    <div class="button-row">
                        <button type="submit" class="button button-primary">Update Profile</button>
                        <button id="delete-button" type="button" class="button button-danger">Delete Account</button>
                    </div>
                </form>
            </section>
        </section>
    </main>

    <script src="./app.js"></script>
</body>
</html>
